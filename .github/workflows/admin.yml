name: Admin dashboard
on:
  pull_request:
    paths: ['admin/**', 'supabase/functions/**', '.github/workflows/admin.yml']
  push:
    paths: ['admin/**', 'supabase/functions/**', '.github/workflows/admin.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  ai-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --config supabase/functions/deno.json --allow-env --allow-net supabase/functions/_shared/openai_client.test.ts supabase/functions/_shared/operations_telemetry.test.ts
