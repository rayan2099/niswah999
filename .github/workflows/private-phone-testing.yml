name: Private phone testing database
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261030210000_private_phone_testing.sql'
      - 'test/database/**'
      - '.github/workflows/private-phone-testing.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/database/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: test/database
      - run: npm test
        working-directory: test/database
