name: Project vault navigation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test cross-platform navigation
        run: python -m unittest scripts.test_sync_project_vault -v
      - name: Verify generated maps and hub links
        run: python scripts/sync_project_vault.py --check
