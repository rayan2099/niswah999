name: Acceptance (persona UI tests)

# Separate from ci.yml's fast unit-test job on purpose (per the
# acceptance-testing charter: "Create a separate acceptance
# workflow/job. Do not overload the fast unit-test job."). Manually
# triggered only (workflow_dispatch) — these are real-simulator
# Flutter integration_test runs against a disposable local Supabase
# backend, materially slower and, in local testing this same wave,
# occasionally flaky (simulator boot timing, a stale-session
# collision between runs) in ways a fast per-PR gate should not
# inherit.
#
# Job success is gated by scripts/verify_acceptance_results.py, not by
# `flutter drive`'s own exit code or a warning annotation: each persona
# writes one structured PASS/FAIL/BLOCKED/SKIPPED result (see
# integration_test/support/harness.dart's `reportResult`), copied out
# to acceptance/results/<test file>.json after every `flutter drive`
# invocation. A crash, a stale build, a missing result file, or an
# unexecuted persona all show up as a missing/non-PASS result file and
# fail the verifier — there is no path from "flutter drive exited
# non-zero" or "no result was written" to a green job. Evidence
# (screenshots + result JSON) uploads via `if: always()` regardless of
# outcome.
#
# Android emulator CI (a second job here, `android-acceptance`) is
# scaffolded but commented out below — GitHub-hosted macOS runners can
# boot an Android emulator via reactivecircus/android-emulator-runner,
# but this was not attempted or validated this wave either.

on:
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  ios-acceptance:
    name: iOS Simulator — persona acceptance suite
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Provision disposable local test backend
        run: bash scripts/provision_local_test_backend.sh

      - name: Point the app at the local test backend
        run: |
          ANON=$(supabase status -o env 2>/dev/null | grep '^ANON_KEY=' | sed -E 's/^ANON_KEY="?([^"]*)"?$/\1/')
          cat > .env << EOF
          APP_ENV=ci-acceptance
          SUPABASE_URL=http://127.0.0.1:54321
          SUPABASE_ANON_KEY=$ANON
          VITE_SUPABASE_URL=http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY=$ANON
          SENTRY_DSN=
          EOF

      - name: Boot an iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"

      - name: Run persona acceptance tests
        run: |
          mkdir -p acceptance/screenshots/ci acceptance/results
          for f in integration_test/p*_test.dart; do
            echo "::group::$f"
            test_id=$(basename "$f" .dart)
            rm -f build/integration_response_data.json

            set +e
            SHOT_DIR=acceptance/screenshots/ci \
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target="$f" \
              -d "$DEVICE_ID" \
              --dart-define=GIT_SHA=${{ github.sha }} \
              --dart-define=ENABLE_DIAGNOSTICS_SCREEN=true \
              --dart-define=BACKEND_ENV=local-test:127.0.0.1:54321
            drive_exit=$?
            set -e

            if [ -f build/integration_response_data.json ]; then
              cp build/integration_response_data.json "acceptance/results/${test_id}.json"
            else
              echo "::warning::$f produced no result file (flutter drive exited $drive_exit) — the verifier will fail this persona"
              printf '{"test_id": "%s", "status": "MISSING_RESULT", "drive_exit_code": %s}' \
                "$test_id" "$drive_exit" > "acceptance/results/${test_id}.json"
            fi
            echo "::endgroup::"
          done

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: |
            acceptance/screenshots/ci/**
            acceptance/results/**
          retention-days: 14

      - name: Verify every required persona reported PASS
        run: |
          python3 scripts/verify_acceptance_results.py \
            acceptance/results integration_test

