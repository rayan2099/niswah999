name: Acceptance (persona UI tests)

# Separate from ci.yml's fast unit-test job on purpose (per the
# acceptance-testing charter: "Create a separate acceptance
# workflow/job. Do not overload the fast unit-test job."). Manually
# triggered only (workflow_dispatch) — these are real-simulator
# Flutter integration_test runs against a disposable local Supabase
# backend, materially slower and, in local testing this same wave,
# occasionally flaky (simulator boot timing, a stale-session
# collision between runs) in ways a fast per-PR gate should not
# inherit. Not yet validated end-to-end in GitHub's own CI
# environment — this file is added as real, runnable infrastructure,
# honestly disclosed as unvalidated in CI specifically (it IS
# validated locally; see production-readiness-results/
# persona-validation/TEST_EXECUTION_REPORT.md).
#
# Android emulator CI (a second job here, `android-acceptance`) is
# scaffolded but commented out below — GitHub-hosted macOS runners can
# boot an Android emulator via reactivecircus/android-emulator-runner,
# but this was not attempted or validated this wave either.

on:
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  ios-acceptance:
    name: iOS Simulator — persona acceptance suite
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Provision disposable local test backend
        run: bash scripts/provision_local_test_backend.sh

      - name: Point the app at the local test backend
        run: |
          ANON=$(supabase status -o env 2>/dev/null | grep '^ANON_KEY=' | sed -E 's/^ANON_KEY="?([^"]*)"?$/\1/')
          cat > .env << EOF
          APP_ENV=ci-acceptance
          SUPABASE_URL=http://127.0.0.1:54321
          SUPABASE_ANON_KEY=$ANON
          VITE_SUPABASE_URL=http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY=$ANON
          SENTRY_DSN=
          EOF

      - name: Boot an iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"

      - name: Run persona acceptance tests
        run: |
          mkdir -p acceptance/screenshots/ci
          for f in integration_test/p*_test.dart; do
            echo "::group::$f"
            SHOT_DIR=acceptance/screenshots/ci \
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target="$f" \
              -d "$DEVICE_ID" \
              --dart-define=GIT_SHA=${{ github.sha }} \
              --dart-define=ENABLE_DIAGNOSTICS_SCREEN=true \
              || echo "::warning::$f failed or was blocked — see logs"
            echo "::endgroup::"
          done

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: |
            acceptance/screenshots/ci/**
          retention-days: 14

